name: Build TWRP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 2
        run: |
          sudo apt-get update
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync ccache default-jdk
          
      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize repo and sync source
        run: |
          mkdir ~/twrp
          cd ~/twrp
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          mkdir -p ~/twrp/device/samsung/j6primelte
          cp -r $GITHUB_WORKSPACE/* ~/twrp/device/samsung/j6primelte/

      - name: Build TWRP
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_j6primelte-eng
          mka recoveryimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Samsung-J6PrimeLTE
          path: |
            /home/runner/twrp/out/target/product/j6primelte/recovery.img
            /home/runner/twrp/out/target/product/j6primelte/recovery.tar
